name: ThingSpeak service checks

on:
  pull_request:
    paths:
      - "thingspeak-service/**"
      - ".github/workflows/thingspeak-service-check.yml"
  push:
    branches: [main]
    paths:
      - "thingspeak-service/**"
      - ".github/workflows/thingspeak-service-check.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile thingspeak-service/bm6_thingspeak_service.py
      - run: python -m pip install -r thingspeak-service/requirements.txt
